<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de diario de ali y kevin</title>
  <!-- Google Fonts: Inter, Outfit, VT323 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  
  <!-- Prefetch HTML Modes for instant transitions -->
  <link rel="prefetch" href="/normal" as="document">
  <link rel="prefetch" href="/edit" as="document">
  <link rel="prefetch" href="/categorias" as="document">
  <link rel="prefetch" href="/configuracion" as="document">
  <link rel="prefetch" href="/radar" as="document">
  
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="theme-neon-arcade">
  <div class="neon-bg"></div>

  <!-- Header -->
  <header>
    <div class="logo-container">
      <span style="font-size: 28px;">🎮</span>
      <div>
        <h1>Gestor de diario de ali y kevin</h1>
        <p style="font-size: 11px; color: var(--text-muted); font-weight: 500;">Diario Kevin y Ali — Colección, Álbum & Radar</p>
      </div>
    </div>

    <div class="header-controls">
      <!-- Season Switcher Pill -->
      <div class="mode-switch" id="season-switch" style="background: rgba(156, 39, 176, 0.2); border-color: var(--accent-color);">
        <button type="button" id="btn-season-2" class="mode-btn active season-btn" data-season="2" onclick="window.switchSeason(2)" style="font-weight: 700;">🌟 Temporada 2</button>
        <button type="button" id="btn-season-1" class="mode-btn season-btn" data-season="1" onclick="window.switchSeason(1)" style="font-weight: 700;">🕰️ Temporada 1</button>
      </div>

      <!-- Mode Navigation Pill -->
      <div class="mode-switch" id="mode-switch-bar">
        <button type="button" id="btn-mode-normal" class="mode-btn nav-tab active" data-mode="normal" onclick="window.switchModeSPA('normal')">👁️ Modo Normal</button>
        <button type="button" id="btn-mode-edit" class="mode-btn nav-tab" data-mode="edit" onclick="window.switchModeSPA('edit')">✏️ Modo Edición</button>
        <button type="button" id="btn-mode-categories" class="mode-btn nav-tab" data-mode="categories" onclick="window.switchModeSPA('categories')">🏷️ Tipos y Categorías</button>
        <button type="button" id="btn-mode-radar" class="mode-btn nav-tab" data-mode="radar" onclick="window.switchModeSPA('radar')">📡 Dispositivos & Radar</button>
        <button type="button" id="btn-mode-config" class="mode-btn nav-tab" data-mode="config" onclick="window.switchModeSPA('config')">⚙️ Configuración</button>
      </div>

      <!-- Logged User Badge -->
      <div id="user-badge" class="user-badge kevin">
        <span id="user-icon">🔵</span>
        <span id="user-name">Kevin</span>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="main-container" id="main-container">
    
    <!-- Left Sidebar: Gallery of raw spirit images (Edit Mode only) -->
    <div class="sidebar hidden" id="sidebar">
      <div class="sidebar-header">
        <h2 id="sidebar-title">Galería de Espíritus</h2>
        <p id="sidebar-subtext">Arrastra imágenes a las categorías para asignarlas o haz clic para moverlas.</p>
      </div>
      <div class="gallery-grid" id="gallery-container">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Central Content Area -->
    <div class="content-area">
      
      <!-- 1. VISTA NORMAL (Álbum) -->
      <div id="normalView" class="view-panel">
        <!-- Normal Mode Toolbar: Stats -->
        <div class="normal-toolbar" id="normal-toolbar">
          <div class="stats-container">
            <div class="stat-pill kevin">
              <span class="stat-label">🔵 Kevin:</span>
              <span class="stat-val" id="stat-kevin">0 / 0</span>
            </div>
            <div class="stat-pill ali">
              <span class="stat-label">🔴 Ali:</span>
              <span class="stat-val" id="stat-ali">0 / 0</span>
            </div>
            <div class="stat-pill both">
              <span class="stat-label">💜 Ambos:</span>
              <span class="stat-val" id="stat-both">0 / 0</span>
            </div>
          </div>
        </div>

        <!-- Search Input Bar -->
        <div class="search-bar-container" id="shared-search-bar-container">
          <div class="search-input-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="spirit-search-input" placeholder="Buscar espíritu por nombre, # ID o variante..." oninput="window.onSearchInput(this.value)">
            <button class="clear-search-btn" id="clear-search-btn" onclick="window.clearSearch()" style="display:none;" title="Limpiar búsqueda">✕ Limpiar</button>
          </div>
        </div>

        <!-- Filter Bar -->
        <div class="normal-toolbar">
          <div class="filter-bar">
            <span style="font-size: 13px; color: var(--text-muted); font-weight: 600; margin-right: 4px;">Filtrar:</span>
            <button class="filter-btn active" onclick="window.setNormalFilter('ALL', this)">Todos</button>
            <button class="filter-btn" onclick="window.setNormalFilter('no_obtenidos', this)">❌ Faltantes para mí</button>
            <button class="filter-btn" onclick="window.setNormalFilter('obtenidos_otro_no_yo', this)">🔁 Tiene mi pareja (no yo)</button>
            <button class="filter-btn" onclick="window.setNormalFilter('obtenidos_yo_no_otro', this)">⭐ Solo yo</button>
            <button class="filter-btn" onclick="window.setNormalFilter('obtenidos_ambos', this)">💜 Ambos</button>
            <button class="filter-btn" onclick="window.setNormalFilter('obtenidos_sin_maestria', this)">👑 Obtenidos sin Maestría</button>
            <button class="filter-btn" onclick="window.setNormalFilter('sin_maestria', this)">☆ Sin Maestría</button>
            <button class="filter-btn" onclick="window.setNormalFilter('maestria_otro_no_yo', this)">👑 Pareja Maestría (yo no)</button>
            <button class="filter-btn" onclick="window.setNormalFilter('maestria_yo_no_otro', this)">👑 Mi Maestría (pareja no)</button>
          </div>
        </div>

        <!-- Categories Container for Normal Mode -->
        <div class="categories-list" id="categories-container">
          <!-- Rendered dynamically by normal-view.js -->
        </div>
      </div>

      <!-- 2. VISTA DE EDICIÓN -->
      <div id="editView" class="view-panel" style="display: none;">
        <div class="actions-bar" id="edit-actions-bar">
          <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn btn-secondary" id="btn-toggle-gallery" onclick="window.toggleGalleryDrawer()" style="border-color: var(--accent-color); color: #e040fb;">
              <span>🖼️</span> <span id="btn-gallery-label">Mostrar Galería</span>
            </button>
            <h2 style="font-family: 'Outfit', sans-serif; font-size: 20px;">Estructura de Categorías & Ranuras</h2>
          </div>
          <div style="display: flex; align-items: center; gap: 10px;">
            <button class="btn btn-secondary" onclick="window.openNewSpiritModal()">➕ Nuevo Espíritu</button>
          </div>
        </div>

        <!-- Categories Container in Edit Mode -->
        <div class="categories-list" id="edit-categories-container">
          <!-- Rendered dynamically -->
        </div>
      </div>

      <!-- 3. VISTA DE CATEGORÍAS Y TIPOS -->
      <div id="categoriesView" class="view-panel" style="display: none;">
        <div class="db-inspector-area" id="categoriesManagerContainer">
          <!-- Rendered dynamically by categories-view.js -->
        </div>
      </div>

      <!-- 4. VISTA DE RADAR GPS -->
      <div id="radarView" class="view-panel" style="display: none;">
        <div class="db-inspector-area" id="radar-container">
          <!-- Rendered dynamically by radar-view.js -->
        </div>
      </div>

      <!-- 5. VISTA DE CONFIGURACIÓN -->
      <div id="configView" class="view-panel" style="display: none;">
        <div class="db-inspector-area" id="config-container">
          <!-- Rendered dynamically by config-view.js -->
        </div>
      </div>

    </div>
  </div>

  <!-- Custom Dialog Modal Overlay -->
  <div class="modal-overlay" id="custom-dialog-overlay">
    <div class="modal-content" style="max-width: 400px; text-align: center;">
      <div id="custom-dialog-icon" style="font-size: 36px; margin-bottom: 8px;">ℹ️</div>
      <p id="custom-dialog-msg" style="font-size: 14px; margin-bottom: 14px; line-height: 1.5;"></p>
      <input type="text" id="custom-dialog-input" style="display:none; width: 100%; padding: 8px; margin-bottom: 14px; border-radius: 8px; background: #12131a; color: #fff; border: 1px solid var(--card-border);">
      <div id="custom-dialog-btns" style="display: flex; gap: 10px; justify-content: center;"></div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="global-toast" class="global-toast"></div>

  <!-- App Main Module Entrypoint -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
