name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\r\n ' | base64 -d > app/google-services.json

      - name: Decode Service Account JSON
        run: |
          mkdir -p app/src/main/assets
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | tr -d '\r\n ' | base64 -d > app/src/main/assets/service-account.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.DIARIO_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > diario_keystore.jks

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}