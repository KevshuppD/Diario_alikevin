name: Build and Release Android App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Decode Google Services JSON
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | tr -d '\r\n ' | base64 -d > app/google-services.json

      - name: Decode Service Account JSON
        run: |
          mkdir -p app/src/main/assets
          echo "${{ secrets.SERVICE_ACCOUNT_JSON_BASE64 }}" | tr -d '\r\n ' | base64 -d > app/src/main/assets/service-account.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.DIARIO_KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 -d > diario_keystore.jks

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --parallel --build-cache

      - name: Extract Release Notes
        id: release_notes
        run: |
          TAG_MSG=$(git tag -l --format='%(contents)' "${{ github.ref_name }}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG=$(git log -1 --pretty=%B | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          fi
          if [ -z "$TAG_MSG" ]; then
            TAG_MSG="Novedades y mejoras en la versión ${{ github.ref_name }}."
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MSG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send FCM Update Notification
        if: success()
        run: |
          pip install google-auth requests
          python3 .github/scripts/send_update_notification.py "${{ github.ref_name }}" "${{ github.repository }}" "${{ steps.release_notes.outputs.notes }}"
        env:
          SERVICE_ACCOUNT_PATH: "app/src/main/assets/service-account.json"